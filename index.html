<!DOCTYPE html>
<html lang="es" class="ajusta-body-fog">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Video e Imagen</title>
    <!--CSS-->
    <link rel="stylesheet" href="css/styles.css">
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Neuton:ital,wght@0,200;0,300;0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
</head>
<body class="ajusta-body-fog">
    <!--Video Background-->
    <video autoplay muted loop id="body-bg-fog">
        <source src="media/video/fog0.mp4" type="video/mp4">

    </video>
    
        <!--Página principal-->
        <div class="container">
            <div class="content">
                <h1 class="creepster-regular">JUEGA O MUERE</h1>
                <p class="neuton-bold">Jugaré, no abandonaré...</p>

        <!--Botón vídeo-->
                <button id="playVideoButton">Continuar</button>
            </div>

        <!--Página vídeo-->
            <div id="videoContainer" class="hidden">
                <video muted id="video" class="fullscreen-video" width="640" height="360" controls>
                    <source src="media/video/jubilado.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de video.
                </video>
            </div>

        <!--Botón Imagen-->
            <div id="imageButtonContainer" class="hidden">
                <button id="showImageButton">Pista</button>
            </div>

        <!--Página Imagen-->
            <div id="imageContainer" class="hidden">
                <img id="image" src="media/img/jubilado2.jpg" alt="Imagen">

        <!--Volver Inicio-->
                <button id="closeImageButton">Ubicación</button>
            </div>
        </div>

<!--JavaScript-->
<script src="js/script.js"></script>
</body>
</html>
